# Netlify config for the React PWA frontend.
# The API is deployed separately (see render.yaml).

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"
  # Skip the build when nothing the site is made of changed. Backend-only and
  # docs-only commits used to rebuild and redeploy the identical site, and every
  # pull request builds a preview too, which is what burns the free allowance.
  # Exit 0 tells Netlify to skip; git diff --quiet exits 1 when there are changes,
  # and also when the comparison cannot be made, so a build still runs if in doubt.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':/frontend' ':/netlify.toml'"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route must fall through to index.html, or a hard
# refresh on /applications returns 404 instead of the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or clients get pinned to an old
# build and stop receiving updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable and safe to cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
